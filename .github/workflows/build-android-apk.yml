name: Compilar APK Android Nativo (LA RAYA MINA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar RayaMina-Android.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-android/package-lock.json

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36, Build Tools, NDK 27 y CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Instalar dependencias de mobile-android
        working-directory: mobile-android
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generar proyecto nativo Android (Expo Prebuild)
        working-directory: mobile-android
        env:
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: https://dmlhmgnkmdjujhefzrmz.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_gM9gIe8-qjOpO-3aKNHokw_uM7Sw5DJ
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_SUPABASE_URL=https://dmlhmgnkmdjujhefzrmz.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_gM9gIe8-qjOpO-3aKNHokw_uM7Sw5DJ
          EOF
          npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK Release (ARM64 + ARMv7, sin Expo Go)
        working-directory: mobile-android/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://dmlhmgnkmdjujhefzrmz.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_gM9gIe8-qjOpO-3aKNHokw_uM7Sw5DJ
          GRADLE_OPTS: -Xmx3584m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m" \
            --no-daemon \
            --max-workers=2

      - name: Preparar archivo RayaMina-Android.apk
        run: |
          cp mobile-android/android/app/build/outputs/apk/release/app-release.apk RayaMina-Android.apk
          ls -lh RayaMina-Android.apk

      - name: Subir APK a GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RayaMina-Android-APK
          path: RayaMina-Android.apk
          retention-days: 30

      - name: Publicar APK descargable en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.${{ github.run_number }}
          name: LA RAYA MINA — Android APK (Build #${{ github.run_number }})
          body: |
            Compilación automática desde GitHub Actions sin Expo Go.
            Descarga **RayaMina-Android.apk** e instálalo directamente en tu teléfono Android.
          files: RayaMina-Android.apk
          make_latest: true
